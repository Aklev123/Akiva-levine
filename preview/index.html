<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkinFitMD Slide 0 Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./slide-zero-intro.css" />
  </head>
  <body>
    <div class="wrapper phaseAnalysis" id="slideZeroPreview">
      <div class="backgroundGlow"></div>

      <div class="brandLayer">
        <div class="brandHeader">
          <div class="logotype" aria-label="SkinFitMD">
            <span>Skin</span>
            <span>Fit</span>
            <span>MD</span>
          </div>
          <p class="tagline">
            Created by a Harvard-trained dermatologist. Guided by AI.
          </p>
        </div>

        <div class="ctaGroup">
          <button class="primaryCta" type="button">Get Started</button>
          <button class="secondaryCta" type="button">
            Already have an account? <span>Sign In</span>
          </button>
        </div>
      </div>

      <div class="phoneRig">
        <div class="phoneFrame">
          <div class="phoneNotch" aria-hidden="true"></div>
          <div class="phoneScreen">
            <div class="screenTrack">
              <section class="analysisScene">
                <div class="analysisMedia">
                  <div class="faceSilhouette">
                    <div class="scanLine"></div>
                  </div>

                  <div class="metricBadge metricTopLeft">
                    <span class="metricLabel">Hydration</span>
                    <span class="metricValue">82</span>
                  </div>
                  <div class="metricBadge metricTopRight">
                    <span class="metricLabel">Redness</span>
                    <span class="metricValue">21</span>
                  </div>
                  <div class="metricBadge metricBottomLeft">
                    <span class="metricLabel">Texture</span>
                    <span class="metricValue">68</span>
                  </div>
                  <div class="metricBadge metricBottomRight">
                    <span class="metricLabel">Even Tone</span>
                    <span class="metricValue">74</span>
                  </div>

                  <div class="progressRing">
                    <div class="progressCore">
                      <span class="progressText">Analyzing photo…</span>
                    </div>
                  </div>
                </div>
              </section>

              <section class="dashboardScene">
                <div class="dashboardRings">
                  <article class="dashboardRing">
                    <div class="dashboardProgress">
                      <svg viewBox="0 0 120 120" role="presentation">
                        <circle cx="60" cy="60" r="52" class="dashboardTrack"></circle>
                        <circle
                          cx="60"
                          cy="60"
                          r="52"
                          class="dashboardIndicator"
                          style="stroke-dashoffset: 58.68"
                        ></circle>
                      </svg>
                      <strong>82</strong>
                    </div>
                    <span>Hydration</span>
                  </article>

                  <article class="dashboardRing">
                    <div class="dashboardProgress">
                      <svg viewBox="0 0 120 120" role="presentation">
                        <circle cx="60" cy="60" r="52" class="dashboardTrack"></circle>
                        <circle
                          cx="60"
                          cy="60"
                          r="52"
                          class="dashboardIndicator"
                          style="stroke-dashoffset: 78.24"
                        ></circle>
                      </svg>
                      <strong>76</strong>
                    </div>
                    <span>Barrier</span>
                  </article>

                  <article class="dashboardRing">
                    <div class="dashboardProgress">
                      <svg viewBox="0 0 120 120" role="presentation">
                        <circle cx="60" cy="60" r="52" class="dashboardTrack"></circle>
                        <circle
                          cx="60"
                          cy="60"
                          r="52"
                          class="dashboardIndicator"
                          style="stroke-dashoffset: 257.54"
                        ></circle>
                      </svg>
                      <strong>21</strong>
                    </div>
                    <span>Redness</span>
                  </article>

                  <article class="dashboardRing">
                    <div class="dashboardProgress">
                      <svg viewBox="0 0 120 120" role="presentation">
                        <circle cx="60" cy="60" r="52" class="dashboardTrack"></circle>
                        <circle
                          cx="60"
                          cy="60"
                          r="52"
                          class="dashboardIndicator"
                          style="stroke-dashoffset: 84.76"
                        ></circle>
                      </svg>
                      <strong>74</strong>
                    </div>
                    <span>Even Tone</span>
                  </article>
                </div>

                <div class="todayCard">
                  <header>
                    <h3>Today</h3>
                    <span class="streak">+18 points</span>
                  </header>
                  <ul>
                    <li>
                      <span>AM Routine</span>
                      <span class="positive">✔ +8</span>
                    </li>
                    <li>
                      <span>Face Scan</span>
                      <span class="negative">–6</span>
                    </li>
                    <li>
                      <span>Targeted Serum</span>
                      <span class="positive">✔ +16</span>
                    </li>
                  </ul>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
